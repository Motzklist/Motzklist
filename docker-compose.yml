# ==============================================================================
# Motzklist — local integration stack
# ==============================================================================
# Orchestrates the four sub-repositories into one running system. Every service
# is built from a sibling directory that must be checked out next to this file:
#
#   Motzklist/            <- this repo (docker-compose.yml, e2e tests, docs)
#   ├── Front-End/        <- Motzklist/Front-End       (client, Next.js)
#   ├── Admin-Front-End/  <- Motzklist/Admin-Front-End (admin, Next.js)
#   ├── Back-End/         <- Motzklist/Back-End        (API gateway, Go)
#   └── Database/         <- Motzklist/Database        (schema + seed SQL)
#
# See README.md ("Repository Setup") for the clone commands. Bring it up with:
#   docker compose up --build
# ==============================================================================

services:
  # ------------------------------------------------------------
  # 1. Client front-end (Next.js) — parents browse and order lists
  # ------------------------------------------------------------
  frontend:
    container_name: motzklist-frontend
    build:
      context: ./Front-End
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the browser bundle at build time, so it
        # must be the URL the *browser* uses — localhost, not the compose
        # service name (the backend port is published to the host below).
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_started

  # ------------------------------------------------------------
  # 2. Admin front-end (Next.js) — staff manage schools/lists/orders
  # ------------------------------------------------------------
  admin:
    container_name: motzklist-admin
    build:
      context: ./Admin-Front-End
      dockerfile: Dockerfile
      args:
        # The admin calls its own same-origin /api/* routes, which proxy
        # server-side to the backend via API_URL (see below).
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_USE_MOCKS: "false"
        API_URL: http://backend:8080
        SESSION_SECRET: local-dev-secret-change-me
    ports:
      - "3001:3001"
    environment:
      # Read server-side at request time by the Next.js API routes.
      API_URL: http://backend:8080
      SESSION_SECRET: local-dev-secret-change-me
    depends_on:
      backend:
        condition: service_started

  # ------------------------------------------------------------
  # 3. API gateway (Go) — single backend for both front-ends
  # ------------------------------------------------------------
  backend:
    container_name: motzklist-backend
    build:
      context: ./Back-End
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Match the database service below. Go reads these via getenvDefault().
      DB_HOST: database
      DB_USER: user
      DB_PASSWORD: user
      DB_NAME: motzklist_db
      DB_SSLMODE: disable
      # CORS allow-origin used by enableCORS() for the client front-end.
      CLIENT_ORIGIN: http://localhost:3000
    # Provides STRIPE_SECRET_KEY / FRONTEND_URL for the payment handlers.
    # Optional: the stack (and the e2e tests) run fine without it; only the
    # Stripe payment flow needs a real key.
    env_file:
      - path: ./Back-End/.env
        required: false

  # ------------------------------------------------------------
  # 4. Database (PostgreSQL) — schema + seed come from the Database repo
  # ------------------------------------------------------------
  database:
    container_name: motzklist-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: motzklist_db
    volumes:
      - motzklist-data:/var/lib/postgresql/data
      # Files in /docker-entrypoint-initdb.d run in alphabetical order, and only
      # on a fresh data volume, so 01-init.sql creates the schema before
      # 02-seed.sql inserts the mock data. The Database repo is the single
      # source of truth for both.
      - ./Database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./Database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d motzklist_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  motzklist-data:
