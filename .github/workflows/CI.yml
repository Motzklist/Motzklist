name: Motzklist CI — Integration & E2E

# Builds the whole stack from the four sub-repositories with docker-compose and
# runs the Playwright end-to-end tests against it. Each sub-repo runs its own
# unit tests / linting in its own CI; this pipeline validates the integration.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: 'Motzklist/Front-End ref'
        default: 'main'
      admin_ref:
        description: 'Motzklist/Admin-Front-End ref'
        default: 'main'
      backend_ref:
        description: 'Motzklist/Back-End ref'
        default: 'main'
      database_ref:
        description: 'Motzklist/Database ref'
        default: 'main'

jobs:
  e2e:
    name: Build stack & run E2E
    runs-on: ubuntu-latest

    # All four sub-repos live under the Motzklist org. Override a ref per run via
    # workflow_dispatch to test an unmerged branch before it lands on main.
    env:
      FRONTEND_REF: ${{ github.event.inputs.frontend_ref || 'main' }}
      ADMIN_REF: ${{ github.event.inputs.admin_ref || 'main' }}
      BACKEND_REF: ${{ github.event.inputs.backend_ref || 'main' }}
      DATABASE_REF: ${{ github.event.inputs.database_ref || 'main' }}

    steps:
      # ----------------------------------------------------------------------
      # Check out this orchestration repo plus the four sub-repos as siblings.
      # All Motzklist repos are public, so the default token reads them and the
      # workflow runs on free Actions minutes — no PAT/secret required.
      # ----------------------------------------------------------------------
      - name: Checkout integration repo
        uses: actions/checkout@v4

      - name: Checkout client front-end
        uses: actions/checkout@v4
        with:
          repository: Motzklist/Front-End
          ref: ${{ env.FRONTEND_REF }}
          path: Front-End

      - name: Checkout admin front-end
        uses: actions/checkout@v4
        with:
          repository: Motzklist/Admin-Front-End
          ref: ${{ env.ADMIN_REF }}
          path: Admin-Front-End

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Motzklist/Back-End
          ref: ${{ env.BACKEND_REF }}
          path: Back-End

      - name: Checkout database
        uses: actions/checkout@v4
        with:
          repository: Motzklist/Database
          ref: ${{ env.DATABASE_REF }}
          path: Database

      # ----------------------------------------------------------------------
      # E2E test runner setup
      # ----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # ----------------------------------------------------------------------
      # Build and start the full stack
      # ----------------------------------------------------------------------
      - name: Start stack with Docker Compose
        run: docker compose up --build -d

      - name: Wait for services to be ready
        run: |
          set -e
          wait_for() {
            echo "Waiting for $1 ..."
            for i in $(seq 1 60); do
              if curl -sSf -o /dev/null "$1"; then echo "  ready"; return 0; fi
              sleep 5
            done
            echo "  timed out waiting for $1"
            return 1
          }
          wait_for http://localhost:8080/api/schools
          wait_for http://localhost:3000
          wait_for http://localhost:3001/signin

      - name: Run end-to-end tests
        run: npm run test:e2e

      # ----------------------------------------------------------------------
      # Diagnostics + cleanup
      # ----------------------------------------------------------------------
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v
