name: Motzklist CI Pipeline

# 1. Trigger: When does this run?
# Runs on every push to 'main' branch or when a Pull Request targets 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest # The virtual environment that runs the job

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Go environment (for Backend & API Gateway)
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # Step 3: Set up Node.js environment (for Web Frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 4: Install Go Linter
      # This is required for the 'make lint' command in the backend to work
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2

      # Step 5: Install Dependencies (Executes 'make install')
      - name: Install Dependencies
        run: make install

      # Step 6: Code Quality Check (Executes 'make lint')
      - name: Run Linters
        run: make lint

      # Step 7: Run Tests (Executes 'make test')
      - name: Run Tests
        run: make test

      # Step 8: Build Project (Executes 'make build')
      - name: Build Project
        run: make build

      # Step 9: Install Playwright and wait-on
      - name: Install E2E Dependencies
        run: |
          npm init -y
          npm install -D @playwright/test wait-on
          npx playwright install --with-deps chromium

      # Step 9b: Checkout Front-End repo
      - name: Checkout Front-End
        uses: actions/checkout@v4
        with:
          repository: 'Motzklist/Front-End'
          path: '../Front-End'

      # Step 9c: Checkout Back-End repo
      - name: Checkout Back-End
        uses: actions/checkout@v4
        with:
          repository: 'Motzklist/Back-End'
          path: '../Back-End'

      # Step 10: Start Full System with Docker
      - name: Start Environment with Docker Compose
        run: docker compose up --build -d

      # Step 10: Start Full System with Docker
      - name: Start Environment with Docker Compose
        run: docker compose up --build -d

      # Step 11: Wait for Next.js to be ready
      - name: Wait for Frontend
        run: npx wait-on http://localhost:3000 --timeout 120000

      # Step 12: Run Playwright Tests
      - name: Run End to End Tests
        run: npx playwright test
